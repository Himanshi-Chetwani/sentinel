spring:
  application:
    name: sentinel

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

management:
  endpoints:
    web:
      exposure:
        include: health

sentinel:
  security:
    jwt:
      issuer: http://sentinel-idp
      audience: sentinel-api
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:keys/public.pem}