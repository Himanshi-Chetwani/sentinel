services:
  postgres:
    image: postgres:17-alpine          # pinned version → reproducible
    environment:
      POSTGRES_DB: ${POSTGRES_DB}      # ${...} values are read from .env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"          # only reachable from your Mac, not your network
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives restarts
    healthcheck:                        # Docker checks the DB is actually ready
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0          # official image, KRaft mode (no Zookeeper)
    ports:
      - "127.0.0.1:9094:9094"          # for apps running on your Mac
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # one node does both jobs
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # containers connect via kafka:9092, your Mac via localhost:9094
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # single broker → replication factor 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy     # wait until DB is actually ready
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092   # internal listener, not localhost
      JWT_PUBLIC_KEY_LOCATION: file:/keys/public.pem
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keys/public.pem:/keys/public.pem:ro

volumes:
  pgdata:
